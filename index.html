<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mountain Trails Apothecary</title>
  <meta name="description" content="Tincture, salve, inventory and recipe tracker for Mountain Trails Wellness Studio.">
  <meta name="theme-color" content="#2E4B32">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Apothecary">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Sections">
      <button data-tab="home"><span class="ti" data-icon="home"></span>Home</button>
      <button data-tab="infusing"><span class="ti" data-icon="bottle"></span>Infusing</button>
      <button data-tab="salves"><span class="ti" data-icon="tin"></span>Salves</button>
      <button data-tab="inventory"><span class="ti" data-icon="shelf"></span>Finished</button>
      <button data-tab="recipes"><span class="ti" data-icon="book"></span>Recipes</button>
    </nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
